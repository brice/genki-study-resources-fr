    <script>Genki.generateQuiz({
      type : 'multi',
      info : Genki.lang.std_culture + '<br>Vous pouvez vouloir lire les  informations culturelles à propos des salutations et inclination (Genki I: p.32) si ce n\'est déjà fait.',

      quizlet : [
        {
          question : 'Japanese se saluent mutuellement en  _____.',
          answers : [
            'As\'inclinant',
            'se serrant les mains',
            's\'embrassant'
          ]
        },
        
        {
          question : 'S\'incliner a d\'autres usages comme ...',
          answers : [
            'Aexprimer le respect, de la gratitude ou des excuses',
            'exprimer amour et paix',
            'exprimer son désaccord'
          ]
        },
        
        {
          question : 'Il existe différentes manière de s\'incliner en allant de...',
          answers : [
            'Aun petit hochement de tête à une inclinaison à 45 degrés du haut du corps',
            'un petit hochement de tête à un coup de tête',
            'un petit hochement de tête à une position à quatre pattes'
          ]
        },
        
        {
          question : 'The longer and deeper you bow, the more _____ it appears to others.',
          answers : [
            'Aformal and respectful',
            'friendly and professional',
            'authoritative and confident'
          ]
        },
        
        {
          question : 'Many Japanese tend to feel uncomfortable with _____.',
          answers : [
            'Aphysical contact',
            'foreigners',
            'the opposite sex'
          ]
        },
        
        {
          question : 'Handshaking is becoming quite common in business situations, especially those involving _____.',
          answers : [
            'Aforeigners',
            'friends',
            'rivals'
          ]
        },
        
        {
          question : 'When meeting someone in a business situation for the first time, it is customary to exchange _____ with a small bow.',
          answers : [
            'Abusiness cards',
            'handshakes',
            'hugs'
          ]
        },
        
        {
          question : 'It is important to clearly show your _____ when exchanging meeshi (business cards).',
          answers : [
            'Arespect',
            'intentions',
            'hands'
          ]
        }
      ]
    });</script>
